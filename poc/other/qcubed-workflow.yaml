id: qcubed-workflow

info:
  name: Qcubed Security Checks
  author: daffainfo
  description: A simple workflow that runs all Qcubed related nuclei templates on a given target.

workflows:
  - template: web/fingerprinthub-web-fingerprints.yaml
    matchers:
      - name: qcubed
        subtemplates:
          - tags: qcubed
