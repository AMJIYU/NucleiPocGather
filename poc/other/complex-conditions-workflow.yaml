id: complex-conditions-workflow

info:
  name: Complex Conditions Workflow
  author: tovask
  severity: info
  description: Workflow to test a complex scenario, e.g. race conditions when evaluating the results of the templates

workflows:
  - template: other/basic-get.yaml
    subtemplates:
      - template: other/nomatch-1.yaml
        subtemplates:
          - template: other/match-2.yaml
  - template: other/match-3.yaml
  - template: other/match-2.yaml
    matchers: 
      - name: test-matcher
        subtemplates:
          - template: other/nomatch-1.yaml
            subtemplates:
              - template: other/basic-get.yaml
  - template: other/match-3.yaml
