id: multimatch-value-share-workflow

info:
  name: MultiMatch Value Share Workflow
  author: tovask
  severity: info
  description: Workflow to test value sharing when multiple matches occur in the extractor template

workflows:
  - template: other/multimatch-value-share-template_3.yaml
    subtemplates:
      - template: other/basic-get-another.yaml
        subtemplates:
          - template: http/http-value-share-template-2.yaml
  - template: other/multimatch-value-share-template_3.yaml
    matchers:
      - name: test-matcher
        subtemplates:
          - template: other/basic-get-another.yaml
            subtemplates:
              - template: http/http-value-share-template-2.yaml
