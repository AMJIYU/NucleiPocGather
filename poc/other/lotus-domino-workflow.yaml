id: lotus-domino-workflow

info:
  name: Lotus Domino Security Checks
  author: CasperGN
  description: A simple workflow that runs all Lotus Domino related nuclei templates on a given target.

workflows:
  - template: detect/tech-detect_15.yaml
    matchers:
      - name: lotus-domino
        subtemplates:
          - template: other/lotus-domino-version.yaml
            subtemplates:
              - template: cve/CVE-2005-2428_9.yaml
