id: jira-service-desk-signup

info:
  name: Jira Service Desk Signup Misconfiguration
  author: TechbrunchFR
  severity: medium
  description: Detects an exposed Jira Service Desk customer signup endpoint.
  reference:
    - https://www.acunetix.com/vulnerabilities/web/atlassian-jira-servicedesk-misconfiguration/
  classification:
    cvss-score: 6.1
    cwe-id: CWE-287
  metadata:
    vendor: atlassian
    product: jira-service-management
  tags: atlassian,jira,servicedesk,misconfig,active

http:
  - method: GET
    path:
      - "{{BaseURL}}/servicedesk/customer/user/signup"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "Service Desk"
          - "public.signup"
        condition: and
