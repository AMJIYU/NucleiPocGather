id: jira-unauthenticated-popular-filters

info:
  name: Jira Unauthenticated Popular Filters
  author: TechbrunchFR
  severity: low
  description: Detects publicly accessible Jira popular filters.
  tags: atlassian,jira,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/secure/ManageFilters.jspa?filter=popular&filterView=popular"
    matchers:
      - type: word
        part: body
        words:
          - "filterlink_"
