name: Go Nuclei POC Monitor

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum templates to validate (0 means all)"
        required: false
        default: "0"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install Nuclei
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/nuclei-bin"
          mkdir -p "$install_dir"
          asset_url="$(curl -fsSL https://api.github.com/repos/projectdiscovery/nuclei/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("_linux_amd64.zip")) | .browser_download_url' \
            | head -n 1)"
          test -n "$asset_url"
          curl -fsSL "$asset_url" -o "$RUNNER_TEMP/nuclei.zip"
          unzip -q "$RUNNER_TEMP/nuclei.zip" nuclei -d "$install_dir"
          chmod +x "$install_dir/nuclei"
          test -x "$install_dir/nuclei"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/nuclei" -version

      - name: Build Go monitor
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "$RUNNER_TEMP/nuclei-poc-monitor" \
            ./cmd/nuclei-poc-monitor

      - name: Run Go monitor
        run: |
          limit="${{ github.event.inputs.limit || '0' }}"
          "$RUNNER_TEMP/nuclei-poc-monitor" --limit "$limit" --workers 4

      - name: Commit generated results
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add poc incompatible metadata
          git diff --cached --quiet || git commit -m "chore: update Go nuclei POC collection"
          git push
